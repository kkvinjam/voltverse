# Storefront: React SPA + nginx API gateway. This is the only workload that receives traffic
# from outside the cluster: CloudFront -> (VPC origin) internal ALB -> TargetGroupBinding -> pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: voltverse
  labels: { app: storefront, app.kubernetes.io/part-of: voltverse }
spec:
  replicas: 2
  selector:
    matchLabels: { app: storefront }
  template:
    metadata:
      labels: { app: storefront, app.kubernetes.io/part-of: voltverse }
    spec:
      automountServiceAccountToken: false
      nodeSelector: { kubernetes.io/arch: amd64 }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: storefront } } }
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: storefront
          image: "${ECR_REGISTRY}/${REPO_PREFIX}/storefront:${IMAGE_TAG}"
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: voltverse
  labels: { app: storefront }
spec:
  type: ClusterIP
  selector: { app: storefront }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Registers storefront pod IPs in the target group of the internal ALB created by CloudFormation.
# Handled by the EKS Auto Mode load balancing capability.
apiVersion: eks.amazonaws.com/v1
kind: TargetGroupBinding
metadata:
  name: storefront
  namespace: voltverse
spec:
  serviceRef:
    name: storefront
    port: 80
  targetGroupARN: "${TARGET_GROUP_ARN}"
  targetType: ip
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storefront
  namespace: voltverse
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: storefront }
