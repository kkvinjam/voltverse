# VoltVerse backend microservices. Each gets its own ServiceAccount, which EKS Pod Identity
# maps to a least-privilege IAM role (see the CloudFormation template).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: voltverse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: voltverse
  labels: { app: catalog, app.kubernetes.io/part-of: voltverse }
  annotations: { description: "Product catalog and search" }
spec:
  replicas: 2
  selector:
    matchLabels: { app: catalog }
  template:
    metadata:
      labels: { app: catalog, app.kubernetes.io/part-of: voltverse }
    spec:
      serviceAccountName: catalog
      nodeSelector: { kubernetes.io/arch: amd64 }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: catalog } } }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: catalog
          image: "${ECR_REGISTRY}/${REPO_PREFIX}/catalog:${IMAGE_TAG}"
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: voltverse-config }
            - configMapRef: { name: voltverse-chaos }
          env:
            - { name: OTEL_SERVICE_NAME, value: catalog }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=voltverse,service.version=${IMAGE_TAG},deployment.environment.name=${ENVIRONMENT_NAME},k8s.namespace.name=voltverse,k8s.deployment.name=catalog,k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME)"
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: voltverse
  labels: { app: catalog }
spec:
  type: ClusterIP
  selector: { app: catalog }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
