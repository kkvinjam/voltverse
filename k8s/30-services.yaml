apiVersion: v1
kind: ServiceAccount
metadata:
  name: assistant
  namespace: voltverse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant
  namespace: voltverse
  labels: { app: assistant, app.kubernetes.io/part-of: voltverse }
  annotations: { description: "Sparky AI agent (Strands + Bedrock)" }
spec:
  replicas: 2
  selector:
    matchLabels: { app: assistant }
  template:
    metadata:
      labels: { app: assistant, app.kubernetes.io/part-of: voltverse }
    spec:
      serviceAccountName: assistant
      nodeSelector: { kubernetes.io/arch: amd64 }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: assistant } } }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: assistant
          image: "${ECR_REGISTRY}/${REPO_PREFIX}/assistant:${IMAGE_TAG}"
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: voltverse-config }
            - configMapRef: { name: voltverse-chaos }
          env:
            # Sparky is observed as a GenAI agent in CloudWatch GenAI Observability (Bedrock AgentCore view).
            # AgentCore requires the ADOT SDK to export directly (not via a collector): traces -> X-Ray OTLP
            # endpoint (lands in aws/spans via Transaction Search), logs -> the agent log group.
            # Metrics go to the collector, whose allow-listed EMF dimensions keep CloudWatch metric counts (and cost)
            # low; ADOT's awsemf exporter would publish every attribute combination as a separate custom metric.
            - { name: OTEL_SERVICE_NAME, value: sparky }
            - { name: AGENT_OBSERVABILITY_ENABLED, value: "true" }
            - { name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "https://xray.${AWS_REGION}.amazonaws.com/v1/traces" }
            - { name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT, value: "https://logs.${AWS_REGION}.amazonaws.com/v1/logs" }
            - { name: OTEL_EXPORTER_OTLP_LOGS_HEADERS, value: "x-aws-log-group=${AGENT_LOG_GROUP},x-aws-log-stream=runtime-logs" }
            - { name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, value: "http://otel-collector.observability:4318/v1/metrics" }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "aws.log.group.names=${AGENT_LOG_GROUP},service.namespace=voltverse,service.version=${IMAGE_TAG},deployment.environment.name=${ENVIRONMENT_NAME},k8s.namespace.name=voltverse,k8s.deployment.name=assistant,k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME)"
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: assistant
  namespace: voltverse
  labels: { app: assistant }
spec:
  type: ClusterIP
  selector: { app: assistant }
  ports:
    - { name: http, port: 8080, targetPort: http }
