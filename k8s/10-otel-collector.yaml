# OpenTelemetry Collector (AWS Distro for OpenTelemetry), next to the CloudWatch agent installed by the
# Amazon CloudWatch Observability add-on (namespace amazon-cloudwatch).
#   CloudWatch agent  <- traces + Application Signals metrics from the injected ADOT SDK (all microservices)
#                     -> X-Ray / Transaction Search, Application Signals, Container Insights (+ container logs)
#   this collector    <- business metrics (voltverse.*) and OTLP logs from the microservices, metrics from Sparky
#     metrics -> CloudWatch Metrics via Embedded Metric Format (awsemf, namespace "VoltVerse")
#     logs    -> CloudWatch OTLP logs endpoint (logs.<region>.amazonaws.com/v1/logs, SigV4)
#     traces  -> CloudWatch OTLP traces endpoint (xray.<region>.amazonaws.com/v1/traces, SigV4), for any
#                workload that sends OTLP traces here instead of to the CloudWatch agent
# and optionally to any external OTLP endpoint (set ExternalOtlpEndpoint on the stack).
# The Sparky agent exports traces/logs directly with the ADOT SDK (required by AgentCore observability)
# and only sends its metrics here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      sigv4auth/xray:
        region: "${AWS_REGION}"
        service: xray
      sigv4auth/logs:
        region: "${AWS_REGION}"
        service: logs

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        timeout: 5s
        send_batch_size: 512
      resource:
        attributes:
          - { key: cloud.provider, value: aws, action: upsert }
          - { key: cloud.platform, value: aws_eks, action: upsert }
          - { key: cloud.region, value: "${AWS_REGION}", action: upsert }
          - { key: k8s.cluster.name, value: "${CLUSTER_NAME}", action: upsert }

    exporters:
      otlphttp/cloudwatch-traces:
        traces_endpoint: "https://xray.${AWS_REGION}.amazonaws.com/v1/traces"
        compression: gzip
        auth: { authenticator: sigv4auth/xray }
      awsemf:
        region: "${AWS_REGION}"
        namespace: VoltVerse
        log_group_name: "${METRICS_LOG_GROUP}"
        log_stream_name: otel-metrics
        dimension_rollup_option: NoDimensionRollup
        resource_to_telemetry_conversion:
          enabled: true
        # Only the dimension sets below become CloudWatch metrics (keeps cardinality and cost low).
        metric_declarations:
          - dimensions: [[service.name], [service.name, http.route], [service.name, http.response.status_code]]
            metric_name_selectors: ["^http\\.server\\.request\\.duration$", "^http\\.client\\.request\\.duration$"]
          - dimensions: [[service.name], [service.name, outcome], [service.name, operation], [service.name, tool],
                         [service.name, category], [service.name, shipping_method]]
            metric_name_selectors: ["^voltverse\\..*"]
          - dimensions: [[service.name], [service.name, gen_ai.request.model]]
            metric_name_selectors: ["^gen_ai\\..*", "^strands\\..*"]
      otlphttp/cloudwatch-logs:
        logs_endpoint: "https://logs.${AWS_REGION}.amazonaws.com/v1/logs"
        compression: gzip
        headers:
          x-aws-log-group: "${APP_LOG_GROUP}"
          x-aws-log-stream: otel-logs
        auth: { authenticator: sigv4auth/logs }
      # __EXTERNAL_EXPORTER__ (replaced at deploy time when ExternalOtlpEndpoint is set)
    service:
      extensions: [health_check, sigv4auth/xray, sigv4auth/logs]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/cloudwatch-traces__EXTERNAL_LIST__]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [awsemf__EXTERNAL_LIST__]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/cloudwatch-logs__EXTERNAL_LIST__]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels: { app: otel-collector }
spec:
  replicas: 2
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
      annotations:
        config-hash: "${COLLECTOR_CONFIG_HASH}"
    spec:
      serviceAccountName: otel-collector
      nodeSelector: { kubernetes.io/arch: amd64 }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: collector
          image: public.ecr.aws/aws-observability/aws-otel-collector:v0.43.3
          args: ["--config=/conf/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
          env:
            - { name: AWS_REGION, value: "${AWS_REGION}" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: health }
          livenessProbe:
            httpGet: { path: /, port: health }
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /conf }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  type: ClusterIP
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
