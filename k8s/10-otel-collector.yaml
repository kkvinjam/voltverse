# OpenTelemetry Collector (AWS Distro for OpenTelemetry).
# Every service sends OTLP traces, metrics and logs here; the collector fans out to
#   traces  -> AWS X-Ray            (awsxray)
#   metrics -> CloudWatch Metrics   (awsemf, namespace "VoltVerse")
#   logs    -> CloudWatch Logs      (awscloudwatchlogs)
# and optionally to any external OTLP endpoint (set ExternalOtlpEndpoint on the stack).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        timeout: 5s
        send_batch_size: 512
      resource:
        attributes:
          - { key: cloud.provider, value: aws, action: upsert }
          - { key: cloud.platform, value: aws_eks, action: upsert }
          - { key: cloud.region, value: "${AWS_REGION}", action: upsert }
          - { key: k8s.cluster.name, value: "${CLUSTER_NAME}", action: upsert }

    exporters:
      awsxray:
        region: "${AWS_REGION}"
        # Become searchable X-Ray annotations
        indexed_attributes:
          - voltverse.order.id
          - voltverse.checkout.outcome
          - voltverse.payment.status
          - session.id
      awsemf:
        region: "${AWS_REGION}"
        namespace: VoltVerse
        log_group_name: "${METRICS_LOG_GROUP}"
        log_stream_name: otel-metrics
        dimension_rollup_option: NoDimensionRollup
        resource_to_telemetry_conversion:
          enabled: true
        # Only the dimension sets below become CloudWatch metrics (keeps cardinality and cost low).
        metric_declarations:
          - dimensions: [[service.name], [service.name, http.route], [service.name, http.response.status_code]]
            metric_name_selectors: ["^http\\.server\\.request\\.duration$", "^http\\.client\\.request\\.duration$"]
          - dimensions: [[service.name], [service.name, outcome], [service.name, operation], [service.name, tool],
                         [service.name, category], [service.name, shipping_method]]
            metric_name_selectors: ["^voltverse\\..*"]
          - dimensions: [[service.name], [service.name, gen_ai.request.model]]
            metric_name_selectors: ["^gen_ai\\..*", "^strands\\..*"]
      awscloudwatchlogs:
        region: "${AWS_REGION}"
        log_group_name: "${APP_LOG_GROUP}"
        log_stream_name: otel-logs
      # __EXTERNAL_EXPORTER__ (replaced at deploy time when ExternalOtlpEndpoint is set)
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [awsxray__EXTERNAL_LIST__]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [awsemf__EXTERNAL_LIST__]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [awscloudwatchlogs__EXTERNAL_LIST__]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels: { app: otel-collector }
spec:
  replicas: 2
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
      annotations:
        config-hash: "${COLLECTOR_CONFIG_HASH}"
    spec:
      serviceAccountName: otel-collector
      nodeSelector: { kubernetes.io/arch: amd64 }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: collector
          image: public.ecr.aws/aws-observability/aws-otel-collector:v0.43.3
          args: ["--config=/conf/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
          env:
            - { name: AWS_REGION, value: "${AWS_REGION}" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: health }
          livenessProbe:
            httpGet: { path: /, port: health }
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /conf }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  type: ClusterIP
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
