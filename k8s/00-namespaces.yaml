apiVersion: v1
kind: Namespace
metadata:
  name: voltverse
  labels:
    app.kubernetes.io/part-of: voltverse
    # The CloudWatch Observability add-on injects an init container (it copies the ADOT Python SDK into an
    # emptyDir) without a container securityContext, which the "restricted" level rejects. Enforce "baseline"
    # and keep "restricted" as warn/audit: every VoltVerse container still sets the restricted controls itself.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: voltverse
    pod-security.kubernetes.io/enforce: restricted
