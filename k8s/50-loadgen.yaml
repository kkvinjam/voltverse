# Synthetic shopper traffic (no AI assistant calls). Tune with the ShopperTrafficPerMinute stack parameter
# (0 disables it), or scale it directly:  kubectl -n voltverse scale deploy/loadgen --replicas=0
# The script (services/loadgen/loadgen.py) and data/products.json (initial stock levels for restocking) are mounted
# from the loadgen-script ConfigMap, which the deployer creates from the files. It reuses the catalog image (Python + httpx). Like the services, it gets the ADOT SDK injected,
# so Application Signals shows loadgen as the client calling the storefront.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: voltverse
  labels: { app: loadgen, app.kubernetes.io/part-of: voltverse }
spec:
  replicas: ${LOADGEN_REPLICAS}
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen, app.kubernetes.io/part-of: voltverse }
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
        script-hash: "${LOADGEN_SCRIPT_HASH}"
    spec:
      automountServiceAccountToken: false
      nodeSelector: { kubernetes.io/arch: amd64 }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loadgen
          image: "${ECR_REGISTRY}/${REPO_PREFIX}/catalog:${IMAGE_TAG}"
          command: ["python", "/scripts/loadgen.py"]
          envFrom:
            - configMapRef: { name: voltverse-config }
            - configMapRef: { name: voltverse-otel }
          env:
            - { name: OTEL_SERVICE_NAME, value: loadgen }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=voltverse,service.version=${IMAGE_TAG}" }
            - { name: TARGET_URL, value: "http://storefront.voltverse" }
            - { name: SHOPPERS_PER_MINUTE, value: "${SHOPPER_TRAFFIC_PER_MINUTE}" }
            - { name: DECLINE_RATE, value: "0.1" }
            # Warehouse: top up products below RESTOCK_BELOW to their initial stock (/scripts/products.json)
            - { name: INVENTORY_URL, value: "http://inventory:8080" }
            - { name: RESTOCK_INTERVAL_S, value: "300" }
            - { name: RESTOCK_BELOW, value: "20" }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: script, mountPath: /scripts }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: script
          configMap: { name: loadgen-script }
        - name: tmp
          emptyDir: {}
