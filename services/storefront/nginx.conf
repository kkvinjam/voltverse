# VoltVerse edge gateway: serves the SPA and exposes ONLY the public API routes the website needs.
# Internal-only endpoints (payment service, inventory reservations/restock, order creation) are
# deliberately not routable from outside the cluster.

upstream catalog   { server catalog:8080; }
upstream inventory { server inventory:8080; }
upstream cart      { server cart:8080; }
upstream checkout  { server checkout:8080; }
upstream orders    { server orders:8080; }
upstream assistant { server assistant:8080; }

# Real viewer IP from CloudFront (header is "ip:port"); fall back to the socket address.
map $http_cloudfront_viewer_address $vv_client {
    "~^(?<ip>.+):\d+$" $ip;
    default            $remote_addr;
}
limit_req_zone $vv_client zone=assistant:10m rate=12r/m;
limit_req_zone $vv_client zone=api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

    location ~ ^/api/catalog/(categories|products(/[A-Za-z0-9-]+)?)$ {
        limit_except GET { deny all; }
        limit_req zone=api burst=40 nodelay;
        rewrite ^/api/catalog(/.*)$ $1 break;
        proxy_pass http://catalog;
    }
    location = /api/inventory/stock {
        limit_except GET { deny all; }
        limit_req zone=api burst=40 nodelay;
        rewrite ^ /stock break;
        proxy_pass http://inventory;
    }
    location ~ "^/api/cart/carts/[0-9a-fA-F-]{36}(/items(/[A-Za-z0-9-]+)?)?$" {
        limit_req zone=api burst=40 nodelay;
        rewrite ^/api/cart(/.*)$ $1 break;
        proxy_pass http://cart;
    }
    location ~ ^/api/checkout/(quote|checkout)$ {
        limit_req zone=api burst=20 nodelay;
        rewrite ^/api/checkout(/.*)$ $1 break;
        proxy_pass http://checkout;
    }
    location ~ "^/api/orders/orders/[A-Za-z0-9-]{1,64}(/cancel)?$" {
        limit_except GET POST { deny all; }
        limit_req zone=api burst=20 nodelay;
        rewrite ^/api/orders(/.*)$ $1 break;
        proxy_pass http://orders;
    }
    location ~ ^/api/assistant/chat(/stream)?$ {
        limit_except POST { deny all; }
        limit_req zone=assistant burst=6 nodelay;
        proxy_buffering off;          # stream Server-Sent Events token by token
        proxy_read_timeout 180s;
        rewrite ^/api/assistant(/.*)$ $1 break;
        proxy_pass http://assistant;
    }
    location /api/ {
        default_type application/json;
        return 404 '{"error":"not_found","message":"Unknown API route"}';
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
